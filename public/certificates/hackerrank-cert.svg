<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%">
  <defs>
    <linearGradient id="hr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1b16"/>
      <stop offset="100%" stop-color="#060f0c"/>
    </linearGradient>
    <linearGradient id="hr-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ea64"/>
      <stop offset="100%" stop-color="#00b34d"/>
    </linearGradient>
    <pattern id="hr-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(0,234,100,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="640" height="400" fill="url(#hr-bg)"/>
  <rect width="640" height="400" fill="url(#hr-grid)"/>

  <!-- Border -->
  <rect x="16" y="16" width="608" height="368" rx="12" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <rect x="22" y="22" width="596" height="356" rx="8" fill="none" stroke="rgba(0,234,100,0.22)" stroke-width="1"/>

  <!-- Top Accent Bar -->
  <rect x="22" y="22" width="596" height="6" fill="url(#hr-green)" rx="3"/>

  <!-- Header: HackerRank Brand -->
  <g transform="translate(48, 56)">
    <!-- Stylized [H] icon -->
    <rect x="0" y="0" width="28" height="28" rx="6" fill="#00ea64"/>
    <text x="14" y="20" fill="#060f0c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" text-anchor="middle">H</text>
    <text x="38" y="20" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="800" letter-spacing="0.5">HackerRank</text>
    <text x="156" y="20" fill="#00ea64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">SKILL CERTIFICATION</text>
  </g>

  <!-- Title & Details -->
  <g transform="translate(48, 125)">
    <text x="0" y="0" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" text-transform="uppercase">CERTIFICATE OF ACCOMPLISHMENT</text>
    <text x="0" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" letter-spacing="-0.3">Problem Solving (Intermediate)</text>
    <text x="0" y="62" fill="#86efac" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500">Data Structures, Algorithms &amp; System Rigor</text>
    <text x="0" y="92" fill="#e4e4e7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Recipient: <tspan fill="#ffffff" font-weight="700">Devesh Singh</tspan> • CTO Certified</text>
  </g>

  <!-- Verification Badge & Date Footer -->
  <g transform="translate(48, 280)">
    <!-- Badge Box -->
    <rect x="0" y="0" width="160" height="34" rx="17" fill="rgba(0,234,100,0.15)" stroke="rgba(0,234,100,0.4)" stroke-width="1"/>
    <!-- Check icon -->
    <circle cx="17" cy="17" r="8" fill="#00ea64"/>
    <path d="M13 17 L16 20 L22 13" fill="none" stroke="#060f0c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="32" y="21" fill="#86efac" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">VERIFIED PASSED</text>

    <!-- Meta Right -->
    <text x="544" y="21" fill="#71717a" font-family="monospace" font-size="10" text-anchor="end">ID: 325D3FB086D5</text>
  </g>
</svg>
