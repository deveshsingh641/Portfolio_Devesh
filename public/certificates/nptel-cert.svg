<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%">
  <defs>
    <linearGradient id="nptel-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#231711"/>
      <stop offset="100%" stop-color="#0f0c0a"/>
    </linearGradient>
    <linearGradient id="nptel-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <pattern id="nptel-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(249,115,22,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="640" height="400" fill="url(#nptel-bg)"/>
  <rect width="640" height="400" fill="url(#nptel-grid)"/>

  <!-- Border -->
  <rect x="16" y="16" width="608" height="368" rx="12" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <rect x="22" y="22" width="596" height="356" rx="8" fill="none" stroke="rgba(249,115,22,0.25)" stroke-width="1"/>

  <!-- Top Accent Bar -->
  <rect x="22" y="22" width="596" height="6" fill="url(#nptel-orange)" rx="3"/>

  <!-- Header: NPTEL / SWAYAM -->
  <g transform="translate(48, 56)">
    <!-- Stylized Emblem -->
    <polygon points="12,0 24,10 20,24 4,24 0,10" fill="#f97316"/>
    <text x="36" y="20" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" letter-spacing="0.5">NPTEL</text>
    <text x="115" y="20" fill="#fdba74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">IIT / SWAYAM</text>
    <text x="215" y="20" fill="#ea580c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">ELITE CERTIFIED</text>
  </g>

  <!-- Title & Course Details -->
  <g transform="translate(48, 130)">
    <text x="0" y="0" fill="#fed7aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" text-transform="uppercase">NATIONAL PROGRAMME ON TECHNOLOGY ENHANCED LEARNING</text>
    <text x="0" y="34" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" letter-spacing="-0.3">Python for Data Science</text>
    <text x="0" y="66" fill="#fb923c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500">Data Analysis, NumPy, Pandas &amp; Applied Statistics</text>
  </g>

  <!-- Verification Badge & Date Footer -->
  <g transform="translate(48, 280)">
    <!-- Badge Box -->
    <rect x="0" y="0" width="160" height="34" rx="17" fill="rgba(249,115,22,0.15)" stroke="rgba(249,115,22,0.4)" stroke-width="1"/>
    <!-- Check icon -->
    <circle cx="17" cy="17" r="8" fill="#f97316"/>
    <path d="M13 17 L16 20 L22 13" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="32" y="21" fill="#ffedd5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">VERIFIED PASS</text>

    <!-- Meta Right -->
    <text x="544" y="21" fill="#71717a" font-family="monospace" font-size="11" text-anchor="end">YEAR: 2025 • NPTEL IIT</text>
  </g>
</svg>
